<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily Routine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --hour-h: 56px;
    --grid-left: 64px;
    --border: #d8dce1;
    --text: #2b2f36;
    --muted: #8a8f98;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif;
    color:var(--text);
    background:#f7f7f8;
  }
  header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 16px;
    border-bottom:1px solid var(--border);
    background:#fff;
    position:sticky;
    top:0;
    z-index:20;
    flex-wrap:wrap;
  }
  header h1{
    font-size:16px;
    font-weight:600;
    margin:0 8px 0 0;
    white-space:nowrap;
  }
  button, input[type=date]{
    font-family:inherit;
    font-size:13px;
    border:1px solid var(--border);
    background:#fff;
    border-radius:8px;
    padding:6px 10px;
    cursor:pointer;
    color:var(--text);
  }
  button:hover{ background:#f0f1f3; }
  button.primary{
    background:#2b2f36;
    color:#fff;
    border-color:#2b2f36;
  }
  button.primary:hover{ background:#1c1f24; }
  .spacer{flex:1;}
  .hint{
    font-size:12px;
    color:var(--muted);
    padding:6px 16px 0 16px;
  }
  .board-wrap{
    padding:16px;
    max-width:760px;
    margin:0 auto;
  }
  .board{
    position:relative;
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    user-select:none;
  }
  .hour-row{
    position:absolute;
    left:0; right:0;
    border-top:1px solid #eef0f2;
    height:var(--hour-h);
  }
  .hour-row.half{
    border-top:1px dashed #f2f3f5;
  }
  .hour-label{
    position:absolute;
    left:0;
    width:var(--grid-left);
    text-align:right;
    padding-right:10px;
    font-size:11px;
    color:var(--muted);
    transform:translateY(-6px);
  }
  .grid-click-area{
    position:absolute;
    left:var(--grid-left);
    right:0;
    top:0;
    bottom:0;
    cursor:crosshair;
  }
  .now-line{
    position:absolute;
    left:var(--grid-left);
    right:0;
    height:2px;
    background:#e0453c;
    z-index:5;
    pointer-events:none;
  }
  .now-line::before{
    content:"";
    position:absolute;
    left:-4px; top:-3px;
    width:8px; height:8px;
    border-radius:50%;
    background:#e0453c;
  }
  .task{
    position:absolute;
    left:var(--grid-left);
    right:8px;
    border-radius:10px;
    border:1.5px solid rgba(0,0,0,0.12);
    padding:6px 8px 8px 8px;
    overflow:hidden;
    cursor:grab;
    box-shadow:0 1px 2px rgba(0,0,0,0.04);
    min-height:22px;
  }
  .task.dragging{ cursor:grabbing; opacity:0.9; z-index:10; }
  .task .top-row{
    display:flex;
    align-items:flex-start;
    gap:6px;
  }
  .task .done-box{
    margin-top:2px;
    cursor:pointer;
    flex:0 0 auto;
  }
  .task .text{
    flex:1;
    font-size:13px;
    line-height:1.3;
    outline:none;
    word-break:break-word;
    cursor:text;
  }
  .task.done .text{
    text-decoration:line-through;
    color:var(--muted);
  }
  .task .time-label{
    font-size:10px;
    color:rgba(0,0,0,0.45);
    margin-top:2px;
  }
  .task .close-btn{
    flex:0 0 auto;
    width:16px; height:16px;
    border-radius:50%;
    background:rgba(0,0,0,0.08);
    color:rgba(0,0,0,0.55);
    font-size:11px;
    line-height:16px;
    text-align:center;
    cursor:pointer;
    opacity:0;
    transition:opacity .1s;
  }
  .task:hover .close-btn{ opacity:1; }
  .task .swatch-btn{
    flex:0 0 auto;
    width:14px; height:14px;
    border-radius:50%;
    border:1px solid rgba(0,0,0,0.2);
    cursor:pointer;
    margin-top:2px;
  }
  .task .palette{
    position:absolute;
    top:100%;
    left:0;
    margin-top:4px;
    display:flex;
    gap:4px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:8px;
    padding:4px;
    box-shadow:0 4px 10px rgba(0,0,0,0.12);
    z-index:15;
  }
  .task .palette .sw{
    width:16px; height:16px;
    border-radius:50%;
    cursor:pointer;
    border:1px solid rgba(0,0,0,0.15);
  }
  .task .resize-handle{
    position:absolute;
    left:0; right:0; bottom:0;
    height:8px;
    cursor:ns-resize;
  }
  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#2b2f36;
    color:#fff;
    padding:8px 14px;
    border-radius:8px;
    font-size:13px;
    opacity:0;
    transition:opacity .2s;
    pointer-events:none;
    z-index:100;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>

<header>
  <h1 id="dateHeading">Today</h1>
  <button id="prevDay">‹</button>
  <input type="date" id="datePicker">
  <button id="nextDay">›</button>
  <button id="todayBtn">Today</button>
  <div class="spacer"></div>
  <button id="addTaskBtn">+ Add task</button>
  <button id="exportBtn" class="primary">Export to Obsidian</button>
</header>
<div class="hint">Drag on the grid to add a task &middot; drag a block to move it &middot; drag its bottom edge to resize &middot; click the text to rename &middot; click the dot to recolor</div>

<div class="board-wrap">
  <div class="board" id="board"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const START_HOUR = 5;
const END_HOUR = 24;
const HOUR_H = 56;
const SNAP_MIN = 15;
const PX_PER_MIN = HOUR_H / 60;
const TOTAL_MIN = (END_HOUR - START_HOUR) * 60;
const TOTAL_H = TOTAL_MIN * PX_PER_MIN;

const COLORS = [
  {fill:'#cfe8ff', border:'#8fbfe8'},
  {fill:'#d3f2dd', border:'#8fd1a3'},
  {fill:'#fff3c4', border:'#e8d27a'},
  {fill:'#ffd6e8', border:'#e89fc0'},
  {fill:'#e6d9ff', border:'#bda3e8'},
  {fill:'#ffe0c2', border:'#e8b07a'},
  {fill:'#c9f2ee', border:'#7ecbc4'},
  {fill:'#e6e6e6', border:'#b8b8b8'},
];

const board = document.getElementById('board');
const dateHeading = document.getElementById('dateHeading');
const datePicker = document.getElementById('datePicker');
const toastEl = document.getElementById('toast');

let currentDate = new Date();
let tasks = [];
let dragState = null;

function fmtDateKey(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function isToday(d){
  return fmtDateKey(d) === fmtDateKey(new Date());
}
function minToHHMM(min){
  const h = Math.floor(min/60), m = min%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function snap(min){
  return Math.round(min / SNAP_MIN) * SNAP_MIN;
}
function clampMin(min){
  return Math.max(START_HOUR*60, Math.min(END_HOUR*60, min));
}
function yToMin(y){
  return clampMin(snap(START_HOUR*60 + y / PX_PER_MIN));
}
function minToY(min){
  return (min - START_HOUR*60) * PX_PER_MIN;
}
function uid(){
  return 't' + Math.floor(Math.random()*1e9) + '_' + Math.floor(performance.now());
}

function hasFileStore(){
  return typeof window.routineStore !== 'undefined';
}

async function loadTasks(){
  const key = fmtDateKey(currentDate);
  if(hasFileStore()){
    tasks = await window.routineStore.load(key);
  }else{
    try{
      const raw = localStorage.getItem('daily-widget:' + key);
      tasks = raw ? JSON.parse(raw) : [];
    }catch(e){
      tasks = [];
    }
  }
}

function saveTasks(){
  const key = fmtDateKey(currentDate);
  if(hasFileStore()){
    window.routineStore.save(key, tasks);
  }else{
    localStorage.setItem('daily-widget:' + key, JSON.stringify(tasks));
  }
}

function renderHeading(){
  const opts = {weekday:'long', month:'short', day:'numeric', year:'numeric'};
  dateHeading.textContent = (isToday(currentDate) ? 'Today · ' : '') + currentDate.toLocaleDateString(undefined, opts);
  datePicker.value = fmtDateKey(currentDate);
}

function renderGrid(){
  board.innerHTML = '';
  board.style.height = TOTAL_H + 'px';

  for(let h = START_HOUR; h <= END_HOUR; h++){
    const y = (h - START_HOUR) * HOUR_H;
    const row = document.createElement('div');
    row.className = 'hour-row';
    row.style.top = y + 'px';
    board.appendChild(row);

    if(h < END_HOUR){
      const half = document.createElement('div');
      half.className = 'hour-row half';
      half.style.top = (y + HOUR_H/2) + 'px';
      board.appendChild(half);
    }

    const label = document.createElement('div');
    label.className = 'hour-label';
    label.style.top = y + 'px';
    label.textContent = (h % 24) + ':00';
    board.appendChild(label);
  }

  const clickArea = document.createElement('div');
  clickArea.className = 'grid-click-area';
  clickArea.id = 'clickArea';
  board.appendChild(clickArea);

  if(isToday(currentDate)){
    const now = new Date();
    const nowMin = now.getHours()*60 + now.getMinutes();
    if(nowMin >= START_HOUR*60 && nowMin <= END_HOUR*60){
      const line = document.createElement('div');
      line.className = 'now-line';
      line.style.top = minToY(nowMin) + 'px';
      board.appendChild(line);
    }
  }

  clickArea.addEventListener('pointerdown', onGridPointerDown);
}

function colorIndexFromHex(fill){
  const idx = COLORS.findIndex(c => c.fill === fill);
  return idx === -1 ? 0 : idx;
}

function renderTasks(){
  document.querySelectorAll('.task').forEach(el => el.remove());
  tasks.slice().sort((a,b)=>a.start-b.start).forEach(t => board.appendChild(buildTaskEl(t)));
}

function buildTaskEl(t){
  const c = COLORS[colorIndexFromHex(t.color)] || COLORS[0];
  const el = document.createElement('div');
  el.className = 'task' + (t.done ? ' done' : '');
  el.dataset.id = t.id;
  el.style.top = minToY(t.start) + 'px';
  el.style.height = Math.max((t.end - t.start) * PX_PER_MIN, 22) + 'px';
  el.style.background = c.fill;
  el.style.borderColor = c.border;

  const topRow = document.createElement('div');
  topRow.className = 'top-row';

  const doneBox = document.createElement('input');
  doneBox.type = 'checkbox';
  doneBox.className = 'done-box';
  doneBox.checked = !!t.done;
  doneBox.addEventListener('pointerdown', e => e.stopPropagation());
  doneBox.addEventListener('change', () => {
    t.done = doneBox.checked;
    el.classList.toggle('done', t.done);
    saveTasks();
  });

  const swatchBtn = document.createElement('div');
  swatchBtn.className = 'swatch-btn';
  swatchBtn.style.background = c.fill;
  swatchBtn.style.borderColor = c.border;
  swatchBtn.addEventListener('pointerdown', e => e.stopPropagation());
  swatchBtn.addEventListener('click', e => {
    e.stopPropagation();
    togglePalette(el, t);
  });

  const textDiv = document.createElement('div');
  textDiv.className = 'text';
  textDiv.contentEditable = 'true';
  textDiv.textContent = t.text || '';
  textDiv.addEventListener('pointerdown', e => e.stopPropagation());
  textDiv.addEventListener('blur', () => {
    t.text = textDiv.textContent.trim();
    saveTasks();
  });
  textDiv.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); textDiv.blur(); }
  });

  const closeBtn = document.createElement('div');
  closeBtn.className = 'close-btn';
  closeBtn.textContent = '✕';
  closeBtn.addEventListener('pointerdown', e => e.stopPropagation());
  closeBtn.addEventListener('click', e => {
    e.stopPropagation();
    tasks = tasks.filter(x => x.id !== t.id);
    saveTasks();
    renderTasks();
  });

  topRow.appendChild(doneBox);
  topRow.appendChild(swatchBtn);
  topRow.appendChild(textDiv);
  topRow.appendChild(closeBtn);

  const timeLabel = document.createElement('div');
  timeLabel.className = 'time-label';
  timeLabel.textContent = minToHHMM(t.start) + ' – ' + minToHHMM(t.end);

  const resizeHandle = document.createElement('div');
  resizeHandle.className = 'resize-handle';
  resizeHandle.addEventListener('pointerdown', e => {
    e.stopPropagation();
    startResize(e, t, el);
  });

  el.appendChild(topRow);
  el.appendChild(timeLabel);
  el.appendChild(resizeHandle);

  el.addEventListener('pointerdown', e => startMove(e, t, el));

  return el;
}

function togglePalette(el, t){
  const existing = el.querySelector('.palette');
  if(existing){ existing.remove(); return; }
  document.querySelectorAll('.palette').forEach(p => p.remove());
  const pal = document.createElement('div');
  pal.className = 'palette';
  COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'sw';
    sw.style.background = c.fill;
    sw.style.borderColor = c.border;
    sw.addEventListener('pointerdown', e => e.stopPropagation());
    sw.addEventListener('click', e => {
      e.stopPropagation();
      t.color = c.fill;
      saveTasks();
      renderTasks();
    });
    pal.appendChild(sw);
  });
  el.appendChild(pal);
}

function startMove(e, t, el){
  if(e.target.closest('.close-btn') || e.target.closest('.swatch-btn') || e.target.closest('.done-box') || e.target.closest('.resize-handle') || e.target.classList.contains('text')){
    return;
  }
  e.preventDefault();
  const boardRect = board.getBoundingClientRect();
  const duration = t.end - t.start;
  const startY = e.clientY;
  const originStart = t.start;
  el.classList.add('dragging');
  el.setPointerCapture && el.setPointerCapture(e.pointerId);

  function onMove(ev){
    const dy = ev.clientY - startY;
    const dMin = snap(dy / PX_PER_MIN);
    let newStart = clampMin(originStart + dMin);
    let newEnd = newStart + duration;
    if(newEnd > END_HOUR*60){
      newEnd = END_HOUR*60;
      newStart = newEnd - duration;
    }
    t.start = newStart;
    t.end = newEnd;
    el.style.top = minToY(t.start) + 'px';
    el.querySelector('.time-label').textContent = minToHHMM(t.start) + ' – ' + minToHHMM(t.end);
  }
  function onUp(){
    el.classList.remove('dragging');
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    saveTasks();
    renderTasks();
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

function startResize(e, t, el){
  e.preventDefault();
  const startY = e.clientY;
  const originEnd = t.end;

  function onMove(ev){
    const dy = ev.clientY - startY;
    const dMin = snap(dy / PX_PER_MIN);
    let newEnd = Math.max(t.start + SNAP_MIN, clampMin(originEnd + dMin));
    t.end = newEnd;
    el.style.height = Math.max((t.end - t.start) * PX_PER_MIN, 22) + 'px';
    el.querySelector('.time-label').textContent = minToHHMM(t.start) + ' – ' + minToHHMM(t.end);
  }
  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    saveTasks();
    renderTasks();
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

function onGridPointerDown(e){
  if(e.target !== e.currentTarget) return;
  const clickArea = e.currentTarget;
  const rect = clickArea.getBoundingClientRect();
  const startY = e.clientY - rect.top;
  const startMinRaw = yToMin(startY);

  const preview = document.createElement('div');
  preview.className = 'task';
  const c = COLORS[Math.floor(Math.random()*COLORS.length)];
  preview.style.background = c.fill;
  preview.style.borderColor = c.border;
  preview.style.top = minToY(startMinRaw) + 'px';
  preview.style.height = '22px';
  board.appendChild(preview);

  let finalStart = startMinRaw;
  let finalEnd = startMinRaw + 30;

  function onMove(ev){
    const y = ev.clientY - rect.top;
    const min = yToMin(y);
    finalStart = Math.min(startMinRaw, min);
    finalEnd = Math.max(startMinRaw, min);
    if(finalEnd - finalStart < SNAP_MIN) finalEnd = finalStart + SNAP_MIN;
    preview.style.top = minToY(finalStart) + 'px';
    preview.style.height = Math.max((finalEnd - finalStart) * PX_PER_MIN, 22) + 'px';
  }
  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    preview.remove();
    if(finalEnd - finalStart < SNAP_MIN){
      finalEnd = finalStart + 30;
    }
    const t = { id: uid(), start: finalStart, end: finalEnd, text: '', color: c.fill, done: false };
    tasks.push(t);
    saveTasks();
    renderTasks();
    const el = board.querySelector('.task[data-id="'+t.id+'"] .text');
    if(el){ el.focus(); }
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

function addTaskDefault(){
  const start = clampMin(snap(Math.max(new Date().getHours()*60 + new Date().getMinutes(), START_HOUR*60)));
  const end = Math.min(start + 30, END_HOUR*60);
  const c = COLORS[tasks.length % COLORS.length];
  const t = { id: uid(), start, end, text: '', color: c.fill, done: false };
  tasks.push(t);
  saveTasks();
  renderTasks();
  const el = board.querySelector('.task[data-id="'+t.id+'"] .text');
  if(el){ el.focus(); }
}

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1800);
}

async function exportMarkdown(){
  const key = fmtDateKey(currentDate);
  const sorted = tasks.slice().sort((a,b)=>a.start-b.start);
  let md = '## Daily Tasks — ' + key + '\n\n';
  if(sorted.length === 0){
    md += '_No tasks recorded._\n';
  }else{
    sorted.forEach(t => {
      const box = t.done ? '[x]' : '[ ]';
      const label = t.text && t.text.length ? t.text : '(untitled task)';
      md += '- ' + box + ' ' + minToHHMM(t.start) + '–' + minToHHMM(t.end) + ' ' + label + '\n';
    });
  }

  if(hasFileStore()){
    const filePath = await window.routineStore.export(key, md);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(md).then(() => {
        showToast('Exported to ' + filePath + ' & copied to clipboard');
      }).catch(() => {
        showToast('Exported to ' + filePath);
      });
    }else{
      showToast('Exported to ' + filePath);
    }
    return;
  }

  const blob = new Blob([md], {type:'text/markdown'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = key + '-tasks.md';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(md).then(() => {
      showToast('Exported — downloaded & copied to clipboard');
    }).catch(() => {
      showToast('Exported — downloaded (clipboard copy failed)');
    });
  }else{
    showToast('Exported — downloaded');
  }
}

async function goToDate(d){
  currentDate = d;
  await loadTasks();
  renderHeading();
  renderGrid();
  renderTasks();
}

document.getElementById('prevDay').addEventListener('click', () => {
  const d = new Date(currentDate);
  d.setDate(d.getDate() - 1);
  goToDate(d);
});
document.getElementById('nextDay').addEventListener('click', () => {
  const d = new Date(currentDate);
  d.setDate(d.getDate() + 1);
  goToDate(d);
});
document.getElementById('todayBtn').addEventListener('click', () => goToDate(new Date()));
datePicker.addEventListener('change', () => {
  if(datePicker.value){
    const [y,m,dd] = datePicker.value.split('-').map(Number);
    goToDate(new Date(y, m-1, dd));
  }
});
document.getElementById('addTaskBtn').addEventListener('click', addTaskDefault);
document.getElementById('exportBtn').addEventListener('click', exportMarkdown);

document.addEventListener('click', e => {
  if(!e.target.closest('.swatch-btn') && !e.target.closest('.palette')){
    document.querySelectorAll('.palette').forEach(p => p.remove());
  }
});

setInterval(() => {
  if(isToday(currentDate)){
    renderGrid();
    renderTasks();
  }
}, 60000);

goToDate(new Date());
</script>
</body>
</html>
