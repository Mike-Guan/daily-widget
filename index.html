<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Widget</title>
  <style>
    :root { --bg:#f5f6fa; --surface:#fff; --surface-alt:#f8f9fc; --text:#202431; --muted:#747b8c; --line:#e6e8ef; --accent:#536dfe; --accent-soft:#e8ebff; --danger:#c84b5b; --shadow:0 10px 30px rgba(35,42,70,.08); --hour:64px; --timeline-left:58px; }
    :root[data-theme="dark"] { --bg:#15171d; --surface:#20232c; --surface-alt:#282c36; --text:#f0f2f7; --muted:#a8adba; --line:#373c49; --accent:#a9b4ff; --accent-soft:#31395d; --danger:#ff9dab; --shadow:0 12px 32px rgba(0,0,0,.25); }
  *{box-sizing:border-box} [hidden]{display:none!important} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",Helvetica,Arial,sans-serif;font-size:14px;min-width:700px} button,input,textarea,select{font:inherit;color:inherit} button{border:0;cursor:pointer} button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 38%,transparent);outline-offset:2px}
    .app-shell{min-height:100vh;display:grid;grid-template-columns:236px minmax(0,1fr)}
    .sidebar{border-right:1px solid var(--line);padding:26px 16px;display:flex;flex-direction:column;gap:22px;background:color-mix(in srgb,var(--surface) 75%,var(--bg))}.brand{display:flex;align-items:center;gap:10px;padding:0 8px}.brand-mark{width:34px;height:34px;flex:none;object-fit:cover;border-radius:11px;box-shadow:0 5px 12px rgba(42,55,115,.16)}.brand strong{font-size:15px}.brand small{display:block;color:var(--muted);margin-top:2px;font-size:11px}.nav-group{display:grid;gap:4px}.nav-label{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 10px 6px;text-transform:uppercase}.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;background:none;border-radius:10px;text-align:left;color:var(--muted)}.nav-item:hover,.nav-item.active{background:var(--accent-soft);color:var(--accent)}.nav-icon{width:18px;text-align:center}.nav-count{margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:1px 7px;font-size:11px;color:var(--muted)}.sidebar-footer{margin-top:auto;padding:0 4px;display:grid;gap:8px}.sync-status{font-size:11px;color:var(--muted);line-height:1.45}.sync-status.ok{color:#3b9c67}.sync-status.warn{color:#b57b12}.subtle-btn{background:none;color:var(--muted);padding:8px;border-radius:8px;text-align:left}.subtle-btn:hover{background:var(--surface-alt);color:var(--text)}
    .main{min-width:0;padding:24px 30px 38px;max-width:1500px;width:100%;margin:0 auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:20px}.date-block{display:flex;align-items:center;gap:10px}.date-block h1{font-size:24px;letter-spacing:-.04em;margin:0}.date-block p{margin:3px 0 0;color:var(--muted);font-size:12px}.route-title h1{font-size:26px;letter-spacing:-.04em;margin:0}.route-title p{margin:4px 0 0;color:var(--muted);font-size:12px}.icon-btn,.toolbar-btn{display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);min-width:34px;height:34px;border-radius:10px;color:var(--muted)}.icon-btn:hover,.toolbar-btn:hover{background:var(--surface-alt);color:var(--text)}.top-actions{display:flex;gap:8px;align-items:center}.toolbar-btn{display:flex;gap:7px;padding:0 11px;font-size:12px}.toolbar-btn.primary{background:var(--text);border-color:var(--text);color:var(--surface)}.toolbar-btn.primary:hover{opacity:.88}.toolbar-btn .dot{width:6px;height:6px;background:#64c996;border-radius:50%}.dashboard{display:grid;grid-template-columns:minmax(280px,1.2fr) repeat(2,minmax(145px,.55fr));gap:12px;margin-bottom:20px}.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(20,28,60,.02)}.quick-card{padding:14px}.quick-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:8px}.quick-row{display:flex;gap:8px}.quick-row input{min-width:0;flex:1;border:0;background:transparent;padding:4px 2px;font-size:14px}.quick-row input::placeholder{color:var(--muted)}.add-round{width:30px;height:30px;flex:none;border-radius:9px;background:var(--accent);color:#fff;font-size:18px;line-height:1}.summary-card{padding:14px 15px;display:flex;flex-direction:column;justify-content:space-between;min-height:76px}.summary-card span{font-size:12px;color:var(--muted)}.summary-card strong{font-size:21px;letter-spacing:-.04em}.summary-card .caption{font-size:11px;color:var(--muted)}.focus-row{display:flex;gap:6px;margin-top:8px}.focus-pip{height:5px;flex:1;border-radius:5px;background:var(--line)}.focus-pip.active{background:var(--accent)}
    .workspace{display:grid;grid-template-columns:minmax(460px,1fr) 255px;gap:18px;align-items:start}.planner{min-width:0}.section-heading{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}.section-heading h2{font-size:14px;margin:0;letter-spacing:-.01em}.section-heading span{font-size:12px;color:var(--muted)}.timeline-card{overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.timeline-scroll{max-height:calc(100vh - 260px);min-height:540px;overflow:auto;overscroll-behavior:contain}.timeline{position:relative;min-height:1216px;user-select:none}.hour-line{position:absolute;left:0;right:0;border-top:1px solid var(--line);height:var(--hour)}.hour-line.half{border-top:1px dashed color-mix(in srgb,var(--line) 70%,transparent)}.hour-label{position:absolute;width:var(--timeline-left);padding-right:11px;text-align:right;transform:translateY(-7px);font-size:10px;color:var(--muted)}.hour-label.first{transform:translateY(6px)}.grid-hit{position:absolute;left:var(--timeline-left);right:0;top:0;bottom:0;cursor:crosshair}.grid-hit.drop-active{background:color-mix(in srgb,var(--accent) 10%,transparent);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--accent) 55%,transparent)}.now-line{position:absolute;left:var(--timeline-left);right:0;height:2px;background:#ec5a61;z-index:4;pointer-events:none}.now-line::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;background:#ec5a61;border-radius:50%}.task{position:absolute;left:calc(var(--timeline-left) + 8px);right:10px;min-height:32px;border:1px solid;padding:6px 8px;border-radius:10px;box-shadow:0 2px 4px rgba(35,42,70,.06);overflow:hidden;z-index:3;transition:box-shadow .12s,transform .12s}.task:hover{box-shadow:0 5px 12px rgba(35,42,70,.13)}.task.dragging{z-index:8;opacity:.92;box-shadow:0 12px 20px rgba(35,42,70,.2)}.task-top{display:flex;align-items:flex-start;gap:6px;min-width:0}.task-check{appearance:none;cursor:pointer;width:14px;height:14px;border:1.5px solid rgba(31,41,55,.35);border-radius:50%;background:rgba(255,255,255,.35);margin:2px 0 0;flex:none}.task-check:checked{background:var(--text);border-color:var(--text)}.task-check:checked::after{content:"✓";display:block;color:#fff;font-size:9px;line-height:12px;text-align:center}.task-title{border:0;background:transparent;padding:0;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:left;flex:1;line-height:1.35;font-size:12px}.task-inline-input{min-width:0;flex:1;border:0;border-bottom:1px solid rgba(35,42,70,.3);outline:0;background:rgba(255,255,255,.42);padding:1px 3px;border-radius:3px;font-size:12px;line-height:1.35}.task.done .task-title{text-decoration:line-through;opacity:.54}.task-meta{font-size:10px;opacity:.64;margin:4px 0 0 20px}.task-actions{display:flex;gap:2px;opacity:0;transition:opacity .12s}.task:hover .task-actions{opacity:1}.task-action{display:grid;place-items:center;width:17px;height:17px;padding:0;background:rgba(255,255,255,.4);border-radius:5px;color:rgba(30,35,45,.7);font-size:11px}.task-action:hover{background:rgba(255,255,255,.75)}.resize-handle{position:absolute;height:12px;left:0;right:0;bottom:0;cursor:ns-resize}.preview{pointer-events:none;opacity:.62}.collection-view{max-width:960px;margin:0 auto}.view-header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:8px 0 18px}.view-header h2{font-size:26px;letter-spacing:-.04em;margin:0}.view-header p{margin:5px 0 0;color:var(--muted)}.view-grid{display:grid;gap:12px}.collection-card{display:flex;align-items:flex-start;gap:12px;min-width:0;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:0 1px 2px rgba(20,28,60,.02)}.collection-card .card-main{flex:1;min-width:0}.collection-card h3{font-size:14px;margin:0 0 5px;overflow-wrap:anywhere}.collection-card p{font-size:12px;color:var(--muted);margin:0;line-height:1.45;overflow-wrap:anywhere}.collection-card.done h3{text-decoration:line-through;color:var(--muted)}.collection-actions{display:flex;gap:7px;flex:0 0 auto}.collection-actions button{padding:7px 9px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:12px}.collection-actions button.primary{background:var(--accent);color:#fff}.review-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}.review-stat{padding:15px;background:var(--surface);border:1px solid var(--line);border-radius:14px}.review-stat strong{display:block;font-size:25px;letter-spacing:-.04em}.review-stat span{font-size:12px;color:var(--muted)}.review-columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}.review-section h3{font-size:14px;margin:0 0 10px}.encouragement{padding:13px 15px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px;line-height:1.5;margin-bottom:18px}
    .side-panel{display:grid;gap:14px;position:sticky;top:18px;min-width:0}.panel{min-width:0;overflow:hidden;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px}.panel.drop-active{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}.panel-title{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:10px}.panel-title button{background:none;color:var(--accent);font-size:12px;padding:0}.inbox-list,.focus-list{display:grid;gap:7px}.inbox-list.expanded{max-height:calc(100vh - 300px);overflow:auto;padding-right:3px}.empty-state{min-width:0;overflow-wrap:anywhere;color:var(--muted);font-size:12px;line-height:1.45;padding:8px 0}.inbox-item{display:flex;gap:7px;align-items:flex-start;min-width:0;padding:9px;border-radius:10px;background:var(--surface-alt);cursor:grab}.inbox-item:active{cursor:grabbing}.inbox-item.drag-source{opacity:.48}.inbox-item strong{flex:1;min-width:0;font-size:12px;line-height:1.4;white-space:normal;overflow-wrap:anywhere}.inbox-item button{flex:0 0 auto;width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent)}.focus-item{display:flex;align-items:center;gap:7px;min-width:0;font-size:12px}.focus-item .category-dot{width:7px;height:7px;border-radius:50%;flex:none}.focus-item span{min-width:0;white-space:normal;overflow-wrap:anywhere;line-height:1.4}.review-btn{width:100%;padding:9px;border-radius:10px;background:var(--surface-alt);color:var(--muted);font-size:12px;text-align:left;white-space:normal;overflow-wrap:anywhere;line-height:1.4}.review-btn:hover{color:var(--text);background:var(--accent-soft)}
    dialog{border:0;padding:0;background:transparent;max-width:min(480px,calc(100vw - 32px));color:var(--text)}dialog::backdrop{background:rgba(18,22,33,.38);backdrop-filter:blur(3px)}.modal{width:460px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 80px rgba(0,0,0,.24);padding:20px}.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-header h3{margin:0;font-size:17px;letter-spacing:-.03em}.modal-close{background:none;color:var(--muted);font-size:20px;padding:2px 5px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted);font-weight:650}.field input,.field textarea,.field select{width:100%;background:var(--surface-alt);border:1px solid var(--line);border-radius:9px;padding:8px 9px}.field textarea{min-height:72px;resize:vertical}.toggle-field{display:flex;gap:8px;align-items:center;padding-top:9px}.modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.modal-actions.export-actions{justify-content:flex-end;gap:8px}.modal-actions .right{display:flex;gap:8px}.danger-btn{background:none;color:var(--danger);padding:7px 0}.cancel-btn,.save-btn{padding:9px 12px;border-radius:9px}.cancel-btn{background:var(--surface-alt);border:1px solid var(--line)}.save-btn{background:var(--accent);color:#fff}.review-list{display:grid;gap:8px}.review-item{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.review-item:last-child{border-bottom:0}.review-item span{flex:1;font-size:13px}.review-item button{padding:6px 8px;background:var(--accent-soft);color:var(--accent);border-radius:7px;font-size:11px}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);opacity:0;pointer-events:none;background:var(--text);color:var(--surface);padding:9px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:12px;transition:.18s ease;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:1200px){.app-shell{grid-template-columns:64px minmax(0,1fr)}.sidebar{padding:22px 10px;align-items:center}.brand strong,.brand small,.nav-label,.nav-item span:not(.nav-icon):not(.nav-count),.nav-count,.sidebar-footer{display:none}.brand{padding:0}.nav-item{justify-content:center;padding:10px}.main{padding:20px}}
    @media(max-width:1150px){.workspace{grid-template-columns:minmax(0,1fr)}.side-panel{position:static;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}}
    @media(max-width:920px){body{min-width:0}}
    @media(max-width:620px){.topbar{align-items:flex-start}.top-actions .toolbar-btn:not(.primary){display:none}.dashboard{grid-template-columns:1fr 1fr}.quick-card{grid-column:1/-1}.summary-card{min-height:67px}.date-block h1{font-size:20px}.main{padding:15px 12px}.side-panel,.review-columns{grid-template-columns:1fr}.timeline-scroll{max-height:none;height:620px}.task-actions{opacity:1}.review-summary{grid-template-columns:1fr 1fr}.view-header h2{font-size:22px}}
    .form-error{margin:12px 0 0;color:var(--danger);font-size:12px;line-height:1.4}.calendar-trigger svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}.calendar-modal{width:360px}.calendar-toolbar{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:10px;margin:0 0 15px}.calendar-toolbar strong{text-align:center;font-size:14px}.calendar-weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calendar-weekdays{margin-bottom:6px}.calendar-weekdays span{text-align:center;font-size:10px;font-weight:700;color:var(--muted)}.calendar-day{height:36px;border-radius:10px;background:transparent;color:var(--text);font-size:12px}.calendar-day:hover{background:var(--surface-alt)}.calendar-day.today{box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}.calendar-day.selected{background:var(--accent);color:#fff}.calendar-day.empty{pointer-events:none}.calendar-actions{justify-content:flex-end;margin-top:15px}
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><img class="brand-mark" src="src/assets/daily-widget-icon.png" alt="Daily Widget"><div><strong>Daily Widget</strong><small data-i18n="brandTagline">轻一点，做重要的事</small></div></div>
      <nav class="nav-group" aria-label="Main navigation">
        <div class="nav-label" data-i18n="workspace">工作区</div>
        <button class="nav-item active" data-view="today"><span class="nav-icon">◷</span><span data-i18n="todayPlan">今日计划</span></button>
        <button class="nav-item" data-view="inbox"><span class="nav-icon">▣</span><span data-i18n="inbox">收集箱</span><span class="nav-count" id="inboxCount">0</span></button>
      </nav>
      <nav class="nav-group">
        <div class="nav-label" data-i18n="rituals">习惯</div>
        <button class="nav-item" data-view="focus"><span class="nav-icon">✦</span><span data-i18n="todayFocus">今日重点</span></button>
        <button class="nav-item" id="reviewNav" data-view="review"><span class="nav-icon">↻</span><span data-i18n="dailyReview">日末回顾</span></button>
      </nav>
      <div class="sidebar-footer"><div id="syncStatus" class="sync-status">本地优先 · 未启用同步</div><button id="syncFolderBtn" class="subtle-btn" data-i18n="setSyncFolder">设置同步文件夹</button></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="date-block" id="todayDateToolbar">
          <button class="icon-btn calendar-trigger" id="datePickerButton" aria-label="Choose date"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><path d="M7.5 3.5v3M16.5 3.5v3M3.5 9.5h17M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"></path></svg></button>
          <div><h1 id="dateHeading">今天</h1><p id="dateSubheading"></p></div>
        </div>
        <div class="route-title" id="routeTitle" hidden></div>
        <div class="top-actions">
          <button class="toolbar-btn" id="todayButton" data-i18n="today">Today</button>
          <button class="toolbar-btn" id="themeButton" title="切换主题">◐</button>
          <button class="toolbar-btn" id="languageButton" title="Language">中 / EN</button>
          <button class="toolbar-btn" id="syncButton"><span class="dot"></span><span data-i18n="sync">同步</span></button>
          <button class="toolbar-btn primary" id="exportButton" data-i18n="exportMarkdown">导出 Markdown</button>
        </div>
      </header>
      <section id="todayPage">
      <section class="dashboard" id="dashboard" aria-label="Today summary">
        <div class="card quick-card"><div class="quick-label" data-i18n="quickAdd">快速添加</div><div class="quick-row"><input id="quickInput" autocomplete="off" data-i18n-placeholder="quickPlaceholder" placeholder="例如：明天 9:30 跑步 45m"><button class="add-round" id="quickAdd" aria-label="Add task">＋</button></div></div>
        <div class="card summary-card"><span data-i18n="nowNext">进行中 / 接下来</span><strong id="nowLabel">轻松开始</strong><div class="caption" id="nowCaption">今天留一点空间给自己</div></div>
        <div class="card summary-card"><span data-i18n="todayDone">今日完成</span><strong id="progressLabel">0 / 0</strong><div class="focus-row" id="progressPips"><i class="focus-pip"></i><i class="focus-pip"></i><i class="focus-pip"></i></div></div>
      </section>
      <section class="workspace" id="workspace">
        <div class="planner"><div class="section-heading"><h2 data-i18n="timeline">时间轴</h2><span data-i18n="timelineHint">空白处拖动即可排入日程 · 15 分钟吸附</span></div><div class="timeline-card"><div class="timeline-scroll"><div class="timeline" id="timeline"></div></div></div></div>
        <aside class="side-panel">
          <section class="panel"><div class="panel-title"><span data-i18n="todayFocus">今日重点</span><button id="clearFocus" data-i18n="manage">管理</button></div><div id="focusList" class="focus-list"></div></section>
          <section class="panel" id="inboxPanel"><div class="panel-title"><span id="inboxPanelTitle" data-i18n="inbox">收集箱</span><button id="newInbox" data-i18n="add">＋ 添加</button></div><div id="inboxContext" class="empty-state"></div><div id="inboxList" class="inbox-list"></div></section>
          <section class="panel"><div class="panel-title"><span data-i18n="wrapUp">收尾</span><span id="reviewCount"></span></div><button class="review-btn" id="reviewButton" data-i18n="reviewAction">回顾未完成事项，安排明天</button></section>
        </aside>
      </section>
      </section>
      <section class="collection-view" id="collectionView" hidden></section>
    </main>
  </div>
  <dialog id="taskDialog"><form class="modal" id="taskForm" method="dialog"><div class="modal-header"><h3 id="taskDialogTitle">新任务</h3><button class="modal-close" value="cancel" aria-label="Close">×</button></div><input id="taskId" type="hidden"><input id="taskDateOriginal" type="hidden"><div class="form-grid"><div class="field full"><label for="taskTitle">任务</label><input id="taskTitle" required placeholder="要完成什么？"></div><div class="field"><label for="taskDate">日期</label><input id="taskDate" type="date"></div><div class="field"><label for="taskCategory">分类</label><select id="taskCategory"><option value="personal">个人</option><option value="health">健康</option><option value="home">生活</option><option value="social">关系</option><option value="learning">学习</option><option value="errands">杂事</option></select></div><div class="field"><label for="taskColor">颜色</label><select id="taskColor"><option value="auto">跟随分类</option><option value="indigo">靛蓝</option><option value="sky">天蓝</option><option value="mint">薄荷绿</option><option value="amber">琥珀黄</option><option value="rose">玫瑰粉</option><option value="violet">紫罗兰</option><option value="coral">珊瑚橙</option></select></div><div class="field"><label for="taskStart">开始时间</label><input id="taskStart" type="time" step="900"></div><div class="field"><label for="taskEnd">结束时间</label><input id="taskEnd" type="time" step="900"></div><div class="field"><label for="taskRecurrence">重复</label><select id="taskRecurrence"><option value="none">不重复</option><option value="daily">每天</option><option value="weekdays">工作日</option><option value="weekly">每周</option></select></div><label class="toggle-field"><input id="taskFocus" type="checkbox"> 设为今日重点</label><div class="field full"><label for="taskUrl">链接</label><input id="taskUrl" type="url" placeholder="https://…"></div><div class="field full"><label for="taskNotes">备注</label><textarea id="taskNotes" placeholder="留给未来自己的补充说明"></textarea></div></div><div class="modal-actions"><button type="button" class="danger-btn" id="deleteTask">删除</button><div class="right"><button type="button" class="cancel-btn" id="cancelTask">取消</button><button class="save-btn" value="default">保存任务</button></div></div></form></dialog>
  <dialog id="reviewDialog"><div class="modal"><div class="modal-header"><h3>日末回顾</h3><button class="modal-close" id="closeReview" aria-label="Close">×</button></div><p style="color:var(--muted);font-size:12px;margin:0 0 12px">未完成的任务不必成为负担，给它一个合适的去处。</p><div class="review-list" id="reviewList"></div></div></dialog>
  <dialog id="calendarDialog"><div class="modal calendar-modal"><div class="modal-header"><h3 id="calendarDialogTitle">选择日期</h3><button class="modal-close" id="closeCalendar" aria-label="Close">×</button></div><div class="calendar-toolbar"><button class="icon-btn" id="previousMonth" aria-label="Previous month">‹</button><strong id="calendarMonthLabel"></strong><button class="icon-btn" id="nextMonth" aria-label="Next month">›</button></div><div class="calendar-weekdays" id="calendarWeekdays"></div><div class="calendar-grid" id="calendarGrid"></div><div class="modal-actions calendar-actions"><button class="cancel-btn" id="calendarToday">今天</button></div></div></dialog>
  <dialog id="exportDialog"><div class="modal"><div class="modal-header"><h3 id="exportDialogTitle">导出 Markdown</h3><button class="modal-close" id="closeExport" aria-label="Close">×</button></div><p id="exportDialogHint" style="color:var(--muted);font-size:12px;margin:0 0 16px">选择要导出的日期范围。</p><div class="form-grid export-range"><div class="field"><label id="exportStartLabel" for="exportStartDate">开始日期</label><input id="exportStartDate" type="date"></div><div class="field"><label id="exportEndLabel" for="exportEndDate">结束日期</label><input id="exportEndDate" type="date"></div></div><p class="form-error" id="exportError" role="alert" hidden></p><div class="modal-actions export-actions"><button class="cancel-btn" id="closeExportSecondary">取消</button><button class="save-btn" id="exportRangeButton">导出选定范围</button></div></div></dialog>
  <div class="toast" id="toast"></div>
  <script src="src/task-model.js"></script>
  <script src="src/web-store.js"></script>
  <script src="src/renderer.js"></script>
</body>
</html>
